<body><pre id=o>…</pre><script>
const JOBS=[
 ["AFTER zoom  sim ","live-AFTER-zoom.png",560,300,480,400],
 ["AFTER zoom  real","live-AFTER-zoom.png",60,350,410,550],
 ["AFTER wide   sim","live-AFTER-wide.png",650,400,300,220],
 ["AFTER wide  real","live-AFTER-wide.png",150,300,410,500],
 ["BEFORE zoom  sim","live-BEFORE-zoom.png",560,300,480,400],
];
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s;});
const q=(a,p)=>{const s=Float64Array.from(a).sort();return s[Math.floor(p*(s.length-1))].toFixed(1);};
(async()=>{let out="";const c=document.createElement("canvas"),g=c.getContext("2d",{willReadFrequently:true});
for(const [lab,src,x,y,w,h] of JOBS){const im=await load(src);if(!im){out+=lab+" MISSING\n";continue;}
 c.width=im.width;c.height=im.height;g.drawImage(im,0,0);
 const d=g.getImageData(x,y,w,h).data,L=[],H=[],S=[],std=[];const lum=new Float32Array(w*h);
 for(let i=0;i<w*h;i++){const r=d[i*4]/255,gg=d[i*4+1]/255,b=d[i*4+2]/255;
  const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),l=(mx+mn)/2;let hh=0,ss=0;
  if(mx!==mn){const dd=mx-mn;ss=l>.5?dd/(2-mx-mn):dd/(mx+mn);
   hh=mx===r?(gg-b)/dd+(gg<b?6:0):mx===gg?(b-r)/dd+2:(r-gg)/dd+4;hh*=60;}
  L.push(l*100);H.push(hh);S.push(ss*100);lum[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];}
 for(let by=0;by+8<=h;by+=8)for(let bx=0;bx+8<=w;bx+=8){let m=0,m2=0;
  for(let yy=0;yy<8;yy++)for(let xx=0;xx<8;xx++){const v=lum[(by+yy)*w+bx+xx];m+=v;m2+=v*v;}
  m/=64;std.push(Math.sqrt(Math.max(0,m2/64-m*m)));}
 out+=`${lab}: L p10=${q(L,.1)} p25=${q(L,.25)} p50=${q(L,.5)} p75=${q(L,.75)} p90=${q(L,.9)} | H=${q(H,.5)} | S=${q(S,.5)} | grain8=${q(std,.5)}\n`;}
document.getElementById("o").textContent=out;})();
</script></body>
