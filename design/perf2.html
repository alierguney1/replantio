<body><pre id=o>…</pre><canvas id=c width=1600 height=1000></canvas>
<script src="crown-render.js"></script>
<script>
// previous app.js drawTree, for a like-for-like timing comparison
function drawTreeOld(g, x, y, r, tree, conifer) {
  if (r < 0.8) { g.fillStyle = `hsla(${100 + tree.hue}, 28%, ${21 + (tree.s - 0.8) * 28}%, 0.55)`; g.fillRect(x, y, 1.3, 1.3); return; }
  const rng = mulberry32(tree.seed);
  const baseH = (conifer ? 96 : 103) + tree.hue, baseS = conifer ? 30 : 26, baseL = conifer ? 17 : 22;
  g.fillStyle = "rgba(8, 12, 6, 0.32)";
  g.beginPath(); g.ellipse(x + r * 0.22, y + r * 0.26, r * 0.9, r * 0.75, 0, 0, 7); g.fill();
  if (r < 3) { g.fillStyle = `hsl(${baseH}, ${baseS}%, ${baseL + 7}%)`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); return; }
  const lobes = 8 + Math.floor(rng() * 4); const sil = new Path2D();
  for (let i = 0; i <= lobes; i++) {
    const a = tree.rot + (i / lobes) * Math.PI * 2, rr = r * (0.8 + rng() * 0.26);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i) sil.quadraticCurveTo(x + Math.cos(a - Math.PI / lobes) * rr * 1.1, y + Math.sin(a - Math.PI / lobes) * rr * 1.1, px, py); else sil.moveTo(px, py);
  }
  sil.closePath();
  g.fillStyle = `hsl(${baseH}, ${baseS}%, ${baseL}%)`; g.fill(sil);
  g.save(); g.clip(sil);
  const clumps = Math.min(26, 6 + Math.floor(r * 1.2));
  for (let i = 0; i < clumps; i++) {
    const a = rng() * Math.PI * 2, d = Math.sqrt(rng()) * r * 0.75, cr = r * (0.15 + rng() * 0.26);
    const cx2 = x + Math.cos(a) * d, cy2 = y + Math.sin(a) * d;
    const lit = ((x - cx2) + (y - cy2)) / (2 * r);
    g.fillStyle = `hsl(${baseH + rng() * 8 - 4}, ${baseS + rng() * 8}%, ${Math.max(10, baseL + 5 + lit * 11 + rng() * 5)}%)`;
    g.beginPath(); g.arc(cx2, cy2, cr, 0, 7); g.fill();
  }
  g.restore();
}
const g = document.getElementById("c").getContext("2d");
const rnd = mulberry32(7), trees = [];
for (let i=0;i<20000;i++) trees.push({x:rnd()*1600,y:rnd()*1000, la:-23.86+rnd()*0.004, ln:-46.44+rnd()*0.004,
  s:.8+rnd()*.4, hue:-10+rnd()*20, rot:rnd()*6.283, seed:Math.floor(rnd()*2147483647)});
setCrownSoft(18,19); crownSet(0,false); crownSet(1,false); crownSet(2,false);
let out = "";
for (const r of [3.7, 7.3, 14.6]) {
  for (const [name, fn] of [["new", drawTree], ["old", drawTreeOld]]) {
    const t = performance.now();
    for (let f=0;f<5;f++) { g.clearRect(0,0,1600,1000); for (const tr of trees) fn(g,tr.x,tr.y,r*tr.s,tr,false); }
    out += `${name} 20000 @ r=${r}: ${((performance.now()-t)/5).toFixed(1)} ms/frame\n`;
  }
}
document.getElementById("o").textContent = out;
</script></body>
