<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replantio · inteligência de replantio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
<div id="map"></div>

<header class="bar">
  <div class="brand" role="button" tabindex="0" style="cursor:pointer">
    <img src="assets/logo.png" alt="" width="20" height="20" style="border-radius:5px">
    <span>Replantio</span>
  </div>
  <div class="search">
    <input id="geo-input" type="search" placeholder="Search a city or place" autocomplete="off" spellcheck="false">
    <ul id="geo-results" hidden></ul>
  </div>
  <button id="draw-btn" title="Draw an area to analyze">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="4 3"/></svg>
    <span id="draw-label">Draw area</span>
  </button>
  <button id="radar-btn" title="Find plantable land">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M21 12h-3M12 21v-3M3 12h3"/></svg>
  </button>
  <button id="import-btn" title="Import area">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/></svg>
  </button>
  <input id="import-input" type="file" accept=".geojson,.json,.kml,.zip" hidden>
  <select id="lang-btn" title="Idioma / Language">
    <option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
  </select>
</header>

<div id="about" hidden></div>

<div id="proj" hidden></div>

<div id="hint" hidden>Click to drop points &middot; right-click, double-click or click the first point to close &middot; Esc cancels</div>

<aside id="panel" hidden>
  <div id="panel-content"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
